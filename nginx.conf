server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sembunyikan versi nginx dari response header.
  server_tokens off;

  # SPA: semua rute non-file dikembalikan ke index.html agar React Router bekerja.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Panggilan API diteruskan ke API Gateway lewat network internal docker.
  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Upload berkas hingga 2MB (+ overhead multipart).
    client_max_body_size 4m;
  }

  location = /health {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"ok","service":"frontend"}';
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
